; Copy this file to platformio_override.ini to activate the wESP32 environment.
; The local override is ignored by Git; this sample preserves the build settings.
; AI: below section was generated by an AI
; Local configuration for Silicognition wESP32 Rev 7 (16 MB physical flash).
; Hardware reference: https://wesp32.com/software/ and https://wesp32.com/hardware/
[platformio]
default_envs = wesp32

[env:wesp32]
extends = env:esp32_eth
board = wesp32
upload_speed = 115200
; Retain the upstream 4 MB layout for the initial build; extra flash is unused.
board_build.partitions = ${esp32.default_partitions}
; Replace the parent's flags to avoid duplicate definitions of audio/button pins.
build_flags =
  ${common.build_flags}
  ${esp32.build_flags}
  -D WLED_RELEASE_NAME=\"WESP32\"
  -DARDUINO_USB_CDC_ON_BOOT=0
  -D WLED_USE_ETHERNET
  -D WLED_ETH_DEFAULT=WLED_ETH_WESP32
  -D WESP32_PHY_RTL8201
  -D RLYPIN=-1
  ; Active-low push button wired between GPIO12 and GND; no external pull-up.
  -D BTNPIN=12
  -D BTNTYPE=BTN_TYPE_PUSH
  ; Analog line-in uses ADC1 on GPIO35, sampled via I2S0.
  -D SR_DMTYPE=0
  -D AUDIOPIN=35
  -D UM_AUDIOREACTIVE_ENABLE
  -D I2S_SDPIN=-1
  -D I2S_WSPIN=-1
  -D I2S_CKPIN=-1
  -D MCLK_PIN=-1
  ; LED1 through LED8. Keep upstream LED type and 30 pixels per output initially.
  ; Set the actual LED types, color orders and pixel counts in LED Preferences.
  -D DATA_PINS=15,4,13,18,23,5,14,33
; AI: end
